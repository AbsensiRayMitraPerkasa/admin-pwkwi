<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><meta name="description" content="Dashboard admin absensi dan patroli PWKWI"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Admin PWKWI</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#172033;background:#f4f7fb}.frame{width:100%;height:100%;border:0;display:none;background:#f4f7fb}.setup{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#dbeafe,transparent 45%),#f4f7fb}.card{width:min(100%,480px);background:white;border:1px solid #e5eaf1;border-radius:18px;padding:30px;box-shadow:0 18px 60px #17255412}.logo{width:50px;height:50px;border-radius:14px;background:#172554;color:white;display:grid;place-items:center;font-weight:800;margin-bottom:20px}h1{font-size:24px;margin:0 0 8px}.sub{color:#64748b;font-size:13px;line-height:1.6;margin:0 0 22px}label{display:block;font-size:12px;font-weight:bold;margin:0 0 7px}input{width:100%;height:44px;border:1px solid #cbd5e1;border-radius:9px;padding:0 12px;font-size:13px;margin-bottom:12px}button{border:0;border-radius:9px;background:#2563eb;color:white;font-weight:bold;padding:12px 16px;cursor:pointer}button:hover{background:#1d4ed8}.actions{display:flex;gap:9px;flex-wrap:wrap}.hint{font-size:11px;color:#64748b;line-height:1.6;margin-top:15px}.error{color:#b91c1c;font-size:12px;min-height:18px;margin-bottom:8px}.toolbar{position:fixed;z-index:5;right:12px;top:12px;display:none;gap:8px}.toolbar button{padding:9px 12px;font-size:11px;opacity:.92}.toolbar .light{background:#fff;color:#172033;border:1px solid #e5eaf1}@media(max-width:560px){.card{padding:23px}.toolbar{top:auto;bottom:10px;right:10px}.toolbar button{padding:8px 10px}}
</style></head><body>
<section class="setup" id="setup"><div class="card"><div class="logo">RMP</div><h1>Admin PWKWI</h1><p class="sub">Hubungkan halaman ini ke deployment Web App Apps Script untuk membuka dashboard absensi dan patroli.</p><label for="url">URL deployment Apps Script</label><input id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="url"><div class="error" id="error"></div><div class="actions"><button onclick="connectApp()">Buka Dashboard Admin</button></div><p class="hint">URL disimpan hanya di browser ini. Dashboard dan data tetap dimuat dari Apps Script. Pastikan deployment Apps Script membatasi akses kepada admin yang berwenang.</p></div></section>
<iframe class="frame" id="app" title="Dashboard Admin PWKWI" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="toolbar" id="toolbar"><button class="light" onclick="changeUrl()">Ganti URL Apps Script</button></div>
<script>
const KEY='pwkwi_admin_app_url';const DEFAULT_URL='https://script.google.com/macros/s/AKfycbwc_eZpPDvhoBZKD8qjf4P_KXYFIWZslDNpIWRpu1-Wm3j5FFSG6k87gqJoM1t89Cwh/exec?page=management';function validUrl(v){try{const u=new URL(v);return u.protocol==='https:'&&u.hostname==='script.google.com'&&u.pathname.indexOf('/macros/s/')===0}catch(e){return false}}function connectApp(){const value=document.getElementById('url').value.trim();if(!validUrl(value)){document.getElementById('error').textContent='Masukkan URL Web App Apps Script yang valid (script.google.com/macros/s/.../exec).';return}localStorage.setItem(KEY,value);openApp(value)}function openApp(value){const u=new URL(value);u.searchParams.set('page','management');document.getElementById('setup').style.display='none';document.getElementById('app').style.display='block';document.getElementById('toolbar').style.display='flex';document.getElementById('app').src=u.toString()}function changeUrl(){document.getElementById('app').src='about:blank';document.getElementById('app').style.display='none';document.getElementById('toolbar').style.display='none';document.getElementById('setup').style.display='grid';document.getElementById('url').value=localStorage.getItem(KEY)||''}window.addEventListener('load',function(){const saved=localStorage.getItem(KEY);const appUrl=(saved&&validUrl(saved))?saved:DEFAULT_URL;if(appUrl&&validUrl(appUrl)){localStorage.setItem(KEY,appUrl);openApp(appUrl)}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){})});</script></body></html>
